name: PRESS temporary browser verification
on: [pull_request]
permissions:
  contents: read
jobs:
  press-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium firefox webkit
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/press-http.log 2>&1 &
          node <<'JS'
          const {chromium,firefox,webkit}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const matrix=[
              [webkit,320,568],[webkit,390,844],[webkit,440,956],
              [webkit,768,1024],[webkit,1024,768],[webkit,1366,1024],
              [chromium,360,640],[chromium,412,915],[chromium,280,720],[chromium,673,841],
              [chromium,800,1280],[chromium,1280,800],[chromium,1440,900],[chromium,1920,1080],
              [firefox,360,800],[firefox,1366,768]];
            for(const [engine,w,h] of matrix){
              const browser=await engine.launch({headless:true});
              const page=await browser.newPage({viewport:{width:w,height:h}});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8765/press/');
              await page.waitForFunction(()=>window.APP_DISPLAY_SETTINGS && document.querySelector('.dzds-entry'));
              assert.equal(await page.locator('.article-link').count(),11);
              assert.deepEqual(await page.locator('time').evaluateAll(es=>es.map(e=>e.dateTime)),['2026-11-24','2026-11-19','2026-11-18','2026-11-13']);
              await page.locator('.langs button[data-lang="en"]').click();
              assert.equal(await page.locator('html').getAttribute('lang'),'en');
              await page.locator('.langs button[data-lang="kr"]').click();
              assert.equal(await page.locator('html').getAttribute('lang'),'ko');
              await page.locator('.dzds-entry').first().click();
              await page.locator('.dzds-panel').waitFor({state:'visible'});
              await page.evaluate(()=>window.APP_DISPLAY_SETTINGS.close());
              for(const scale of [100,150,200,300,400]){
                for(const contrast of [false,true]){
                  await page.evaluate(v=>window.APP_DISPLAY_SETTINGS.set(v),{scale,contrast});
                  await page.waitForTimeout(150);
                  assert.equal(await page.locator('html').getAttribute('data-dz-scale'),String(scale));
                  assert.equal(await page.locator('html').evaluate(e=>e.classList.contains('dz-hc')),contrast);
                  const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2);
                  assert.equal(overflow,false,engine.name()+' '+w+' '+h+' '+scale+'% overflow');
                }
              }
              await page.reload();
              assert.deepEqual(await page.evaluate(()=>window.APP_DISPLAY_SETTINGS.get()),{scale:400,contrast:true});
              await page.evaluate(()=>window.APP_DISPLAY_SETTINGS.reset());
              await page.goto('http://127.0.0.1:8765/');
              assert.equal(await page.locator('#menu a[href="/press/"]').count(),1);
              assert.equal(await page.locator('#menu a[href="/press/"]').evaluate(e=>e.nextElementSibling.textContent.trim()),'ABOUT');
              assert.equal(errors.length,0,errors.join('\n'));
              console.log('PASS '+engine.name()+' '+w+'x'+h+' 5 scales × 2 contrasts, KR/EN, persistence, menu');
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
