name: DUNGZAK LAB screen reader and keyboard QA
on:
  push:
    branches: [feat/voiceover-talkback-20261122]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Start local site
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dz-lab-http.log 2>&1 &
      - name: Test accessible DOM and keyboard
        env:
          QA_ENGINE: ${{ matrix.engine }}
        run: node qa/screenreader-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dz-lab-screenreader-${{ matrix.engine }}
          path: qa-results/screenreader-${{ matrix.engine }}/
          if-no-files-found: warn
